version: "3.9"

services:
  backend:
    build:
      context: .
    image: hookahcalc-backend:dev
    container_name: hookahcalc-backend
    env_file:
      - .env.docker
    ports:
      # Хост:Контейнер — оба читаются из .env.docker
      - "${HOST_PORT:-8080}:${PORT:-8080}"
    volumes:
      - hookah-data:/app/data
    restart: unless-stopped

volumes:
  hookah-data: